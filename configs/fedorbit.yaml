base_seed: 260926
workspace_directory: outputs

datasets:
  raw_directory: data/raw
  nbaiot:
    relative_directory: N-BaIoT
    devices:
      - Danmini_Doorbell
      - Ecobee_Thermostat
      - Ennio_Doorbell
      - Philips_B120N10_Baby_Monitor
      - Provision_PT_737E_Security_Camera
      - Provision_PT_838_Security_Camera
      - Samsung_SNH_1011_N_Webcam
      - SimpleHome_XCS7_1002_WHT_Security_Camera
      - SimpleHome_XCS7_1003_WHT_Security_Camera
    attack_rows_per_file: 3000
    benign_support_fraction: 0.6666666666666666
  gotham:
    relative_directory: Gotham2025/extracted/processed
    window_seconds: 2
    attack_window_minimum_fraction: 0.5
    benign_support_fraction: 0.6666666666666666
    benign_label: Benign
    excluded_label: Unknown

detectors:
  gaussian:
    minimum_scale: 1.0e-06
    standard_deviation_floor_fraction: 0.5
  autoencoder:
    hidden_width: 64
    bottleneck_width: 16
    training_steps: 600
    batch_size: 64
    learning_rate: 0.001
    federated_rounds: 10
    federated_local_steps: 30
    federated_partner_rows: 1000

operating_point:
  nominal_false_positive_rate: 0.01

partner_similarity:
  scale_floor: 0.001

statistics:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  alpha: 0.05
  saturation_headroom: 0.01
  minimum_recovery_headroom: 0.01
  maximum_auroc_standard_error: 0.05

experiments:
  - id: cold-start-ladder
    dataset: nbaiot
    detector: gaussian
    support_sizes: [30, 100, 300, 1000]
    replicates: 30
    report_operating_point: true
    conditions:
      local-standardised: {channel: local-standardised}
      local-unscaled: {channel: local-unscaled}
      local-standard-deviation-floor: {channel: local-standard-deviation-floor}
      local-full-support: {channel: local-full-support}
      shared-marginals: {channel: shared-marginals, partner_policy: all}
      shared-covariance-300: {channel: shared-covariance, partner_policy: all, dose_rows: 300}
      shared-covariance-3000: {channel: shared-covariance, partner_policy: all, dose_rows: 3000}
    contrasts:
      - {name: marginals-over-local-standardised, family: primary, treatment: shared-marginals, control: local-standardised, support_sizes: [30], stratum: all, direction: greater}
      - {name: marginals-over-local-unscaled, family: primary, treatment: shared-marginals, control: local-unscaled, support_sizes: [30], stratum: all, direction: greater}
      - {name: marginals-over-local-standard-deviation-floor, family: primary, treatment: shared-marginals, control: local-standard-deviation-floor, support_sizes: [30], stratum: all, direction: greater}
      - {name: dose-marginals-over-local-standardised, family: secondary, treatment: shared-marginals, control: local-standardised, support_sizes: [100, 300, 1000], stratum: all, direction: greater}
      - {name: dose-marginals-over-local-unscaled, family: secondary, treatment: shared-marginals, control: local-unscaled, support_sizes: [100, 300, 1000], stratum: all, direction: greater}
      - {name: dose-marginals-over-local-standard-deviation-floor, family: secondary, treatment: shared-marginals, control: local-standard-deviation-floor, support_sizes: [100, 300, 1000], stratum: all, direction: greater}
      - {name: marginals-over-local-standardised-unsaturated, family: secondary, treatment: shared-marginals, control: local-standardised, support_sizes: [30, 100, 300, 1000], stratum: unsaturated, direction: greater}
      - {name: covariance-300-versus-marginals, family: secondary, treatment: shared-covariance-300, control: shared-marginals, support_sizes: [30, 100, 300, 1000], stratum: all, direction: two-sided}
      - {name: covariance-3000-versus-marginals, family: secondary, treatment: shared-covariance-3000, control: shared-marginals, support_sizes: [30, 100, 300, 1000], stratum: all, direction: two-sided}
      - {name: covariance-3000-versus-marginals-saturated, family: secondary, treatment: shared-covariance-3000, control: shared-marginals, support_sizes: [30, 100, 300, 1000], stratum: saturated, direction: less}

  - id: partner-selection
    dataset: nbaiot
    detector: gaussian
    support_sizes: [30, 100, 300]
    replicates: 30
    report_operating_point: false
    conditions:
      local-standardised: {channel: local-standardised}
      local-full-support: {channel: local-full-support}
      shared-marginals-all: {channel: shared-marginals, partner_policy: all}
      shared-marginals-deployable-nearest-2: {channel: shared-marginals, partner_policy: deployable-nearest, partner_count: 2}
      shared-marginals-oracle-nearest-2: {channel: shared-marginals, partner_policy: oracle-nearest, partner_count: 2}
      shared-marginals-random-2: {channel: shared-marginals, partner_policy: random, partner_count: 2}
    contrasts:
      - {name: deployable-nearest-versus-all, family: secondary, treatment: shared-marginals-deployable-nearest-2, control: shared-marginals-all, support_sizes: [30, 100, 300], stratum: all, direction: two-sided}
      - {name: oracle-nearest-versus-all, family: secondary, treatment: shared-marginals-oracle-nearest-2, control: shared-marginals-all, support_sizes: [30, 100, 300], stratum: all, direction: two-sided}
      - {name: deployable-nearest-versus-random, family: exploratory, treatment: shared-marginals-deployable-nearest-2, control: shared-marginals-random-2, support_sizes: [30, 100, 300], stratum: all, direction: two-sided}
      - {name: oracle-nearest-versus-deployable-nearest, family: exploratory, treatment: shared-marginals-oracle-nearest-2, control: shared-marginals-deployable-nearest-2, support_sizes: [30, 100, 300], stratum: all, direction: two-sided}

  - id: deep-detector
    dataset: nbaiot
    detector: autoencoder
    support_sizes: [30, 100]
    replicates: 8
    report_operating_point: false
    conditions:
      local-standardised: {channel: local-standardised}
      local-full-support: {channel: local-full-support}
      shared-marginals: {channel: shared-marginals, partner_policy: all}
      federated-averaging: {channel: federated-averaging, partner_policy: all}
    contrasts:
      - {name: autoencoder-marginals-over-local-standardised, family: secondary, treatment: shared-marginals, control: local-standardised, support_sizes: [30, 100], stratum: all, direction: greater}
      - {name: autoencoder-federated-averaging-versus-marginals, family: secondary, treatment: federated-averaging, control: shared-marginals, support_sizes: [30, 100], stratum: all, direction: two-sided}

  - id: simulated-boundary
    dataset: gotham
    detector: gaussian
    support_sizes: [10, 30, 100]
    replicates: 30
    report_operating_point: true
    conditions:
      local-standardised: {channel: local-standardised}
      local-unscaled: {channel: local-unscaled}
      local-standard-deviation-floor: {channel: local-standard-deviation-floor}
      local-full-support: {channel: local-full-support}
      shared-marginals: {channel: shared-marginals, partner_policy: all}
      shared-covariance-300: {channel: shared-covariance, partner_policy: all, dose_rows: 300}
    contrasts:
      - {name: gotham-marginals-versus-local-standardised, family: secondary, treatment: shared-marginals, control: local-standardised, support_sizes: [10, 30, 100], stratum: all, direction: two-sided}
      - {name: gotham-covariance-300-versus-local-standardised, family: secondary, treatment: shared-covariance-300, control: local-standardised, support_sizes: [10, 30, 100], stratum: all, direction: less}
      - {name: gotham-covariance-300-versus-marginals, family: secondary, treatment: shared-covariance-300, control: shared-marginals, support_sizes: [10, 30, 100], stratum: all, direction: less}
