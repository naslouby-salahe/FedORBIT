[project]
name = "fedorbit"
version = "0.1.0"
description = "FedORBIT — cold-start collaboration for benign-only IoT anomaly detection: information-channel decomposition"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "FedORBIT" }]
dependencies = [
    "torch==2.13.0",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pydantic==2.13.4",
    "typer==0.27.1",
    "pyyaml>=6.0.2",
    "structlog==25.5.0",
    "matplotlib>=3.11.1",
]

[tool.uv]
constraint-dependencies = ["click==8.1.8"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "pyright==1.1.411",
    "nox>=2024.10.9",
    "vulture>=2.14",
    "deptry>=0.23",
]

[project.scripts]
fedorbit = "fedorbit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedorbit"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
exclude = ["outputs", "results", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "N", "ARG"]
ignore = ["N802", "N803", "N806", "N999"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
filterwarnings = ["error"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
reportMissingImports = "warning"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"

[tool.deptry]
per_rule_ignores = { DEP001 = ["fedorbit"], DEP002 = ["pytest", "pytest-cov", "ruff", "pyright", "nox", "vulture", "deptry"], DEP003 = ["fedorbit"] }

[tool.vulture]
paths = ["src"]
min_confidence = 60
ignore_decorators = ["@app.command", "@model_validator"]
ignore_names = [
    "model_config",
    "kind",
    "benchmark",
    "main",
    "DEEP_DETECTOR",
    "SIMULATED_BOUNDARY",
    "SECONDARY",
    "EXPLORATORY",
    "TWO_SIDED",
    "UNSATURATED",
]

[tool.coverage.run]
source = ["fedorbit"]

[tool.coverage.report]
fail_under = 95
show_missing = true
