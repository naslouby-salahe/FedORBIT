[project]
name = "fedorbit"
version = "0.1.0"
description = "FedORBIT — cross-schema federated procedural-transfer research repository"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "FedORBIT" }]
dependencies = [
    "torch==2.13.0",
    "numpy==2.5.2",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "highspy==1.15.1",
    "pyscipopt==6.2.1",
    "pydantic==2.13.4",
    "typer==0.27.1",
    "psutil==7.2.2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "pyright==1.1.411",
    "nox>=2024.10.9",
]

[project.scripts]
fedorbit = "fedorbit.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedorbit"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
exclude = ["outputs", "results", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "N"]
ignore = ["N802", "N803", "N806", "N999"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.13"
reportMissingTypeStubs = "none"
reportMissingImports = "warning"
